name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir -p www
          cp "$(ls *.html | head -1)" www/index.html
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.masrafk.app","appName":"مصرفك","webDir":"www","server":{"androidScheme":"https"}}
          EOF
          npx cap add android
      - name: Icons
        run: |
          sudo apt-get install -y imagemagick
          ICON=$(ls icon.* | head -1)
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert "$ICON" -resize ${s}x${s}! $R/mipmap-$d/$n.png
            done
          done
      - name: Build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: masrafk-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
